[project]
name = "mcp-factory"
version = "0.1.0"
description = "Multi-agent system for dynamic MCP server generation using local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "fastmcp>=2.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.3.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-factory = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "codegen",
    "domain",
    "requirements",
    "services",
    "shared",
    "cli",
    "config",
    "context",
    "deployer",
    "events",
    "interfaces",
    "llm",
    "models",
    "orchestrator",
    "registry",
]
include = [
    "main.py",
    "templates/*.j2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
